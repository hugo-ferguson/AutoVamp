[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autovamp"
dynamic = ["version"]
description = "Audio player with interactive vamp loops"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "sounddevice",
    "soundfile",
]

[project.optional-dependencies]
gui = ["dearpygui"]

[tool.setuptools.dynamic]
version = {attr = "autovamp.__version__"}

[tool.setuptools.package-data]
autovamp = ["gui/fonts/*.ttf", "gui/fonts/*.txt", "gui/help.txt"]

[project.scripts]
autovamp = "autovamp.__main__:main"
